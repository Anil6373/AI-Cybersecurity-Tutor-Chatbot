<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Test your cybersecurity knowledge with Cyber Tutor AI's interactive quiz mode. Topics include networking, web security, cryptography, Linux, and ethical hacking."/>
  <title>Quiz — Cyber Tutor AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/quiz-roadmap.css"/>
  
  <!-- Supabase & Auth Protection -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/protectRoute.js"></script>
  <script src="../js/userProfile.js"></script>
  
  <script src="../js/theme.js"></script>
</head>
<body>

  <!-- Toast -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <!-- Navbar -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <a href="../../index.html" class="nav-brand" aria-label="Cyber Tutor AI home">
      <div class="brand-icon" aria-hidden="true">🛡</div>
      <span>CyberTutor <span class="brand-ai">AI</span></span>
    </a>
    <div class="nav-links">
      <a href="chat.html">Chat</a>
      <a href="quiz.html" class="active" aria-current="page">Quiz</a>
      <a href="roadmap.html">Roadmap</a>
    </div>
    <div class="nav-spacer"></div>
    <div class="nav-actions">
      <div class="user-profile-container" style="display:none; align-items:center; gap:8px; margin-right:16px;">
        <div class="profile-avatar-text" style="width:28px; height:28px; background:var(--accent-blue); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:12px;">U</div>
        <div class="profile-name-text" style="font-size:0.875rem; font-weight:500; color:var(--text-primary); display:none;">User</div>
        <button class="logout-btn" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:14px; margin-left:4px;" title="Logout">🚪</button>
      </div>
      <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle color theme">
        <span class="theme-icon" aria-hidden="true">☽</span>
      </button>
    </div>
  </nav>

  <div class="inner-page">
    <div class="page-container">

      <!-- Page Header -->
      <div class="page-header">
        <p class="section-eyebrow">Test Your Knowledge</p>
        <h1>Quiz Mode 🧠</h1>
        <p class="page-subtitle">Pick a topic and test your cybersecurity knowledge with curated MCQ questions.</p>
      </div>

      <!-- Topic Selector -->
      <div id="topicSelect" role="region" aria-label="Topic selection">
        <div class="topic-selector" role="group" aria-label="Choose a quiz topic">
          <button class="topic-btn" data-topic="networking" aria-pressed="false">
            <span class="topic-btn-icon" aria-hidden="true">🌐</span> Networking
          </button>
          <button class="topic-btn" data-topic="websec" aria-pressed="false">
            <span class="topic-btn-icon" aria-hidden="true">🔐</span> Web Security
          </button>
          <button class="topic-btn" data-topic="crypto" aria-pressed="false">
            <span class="topic-btn-icon" aria-hidden="true">🔑</span> Cryptography
          </button>
          <button class="topic-btn" data-topic="linux" aria-pressed="false">
            <span class="topic-btn-icon" aria-hidden="true">🐧</span> Linux
          </button>
          <button class="topic-btn" data-topic="ethical" aria-pressed="false">
            <span class="topic-btn-icon" aria-hidden="true">⚔️</span> Ethical Hacking
          </button>
        </div>
        <div class="start-section">
          <button class="btn btn-primary btn-lg" onclick="startQuiz()" id="startQuizBtn">
            Start Quiz <span class="btn-arrow" aria-hidden="true">→</span>
          </button>
        </div>
      </div>

      <!-- Quiz Card -->
      <div id="quizArea" style="display:none;" role="region" aria-label="Quiz questions">
        <div class="quiz-card">

          <div class="quiz-meta">
            <span id="qNum" class="quiz-qnum" aria-live="polite">Question 1 of 5</span>
            <span id="scoreDisplay" class="score-badge" aria-live="polite">Score: 0/5</span>
          </div>

          <div class="quiz-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Quiz progress">
            <div class="progress-wrap">
              <div class="progress-fill" id="progressFill" style="width:0%"></div>
            </div>
          </div>

          <p class="quiz-question" id="questionText" aria-live="polite"></p>

          <div class="quiz-options" id="optionsContainer" role="group" aria-label="Answer choices"></div>

          <div class="quiz-explanation" id="explanation" role="region" aria-label="Explanation" aria-live="polite"></div>

          <div class="quiz-actions">
            <button class="btn btn-ghost" onclick="restartQuiz()">← Back to Topics</button>
            <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">
              Next Question <span class="btn-arrow" aria-hidden="true">→</span>
            </button>
          </div>

        </div>
      </div>

      <!-- Result Screen -->
      <div id="resultScreen" style="display:none;" role="region" aria-label="Quiz results">
        <div class="quiz-card result-screen">
          <span class="result-icon" id="resultIcon" aria-hidden="true">🏆</span>
          <div class="result-score" id="resultScore" aria-live="assertive">
            <span class="score-accent" id="resultScoreNum">5</span><span style="color:var(--text-muted)">/5</span>
          </div>
          <p class="result-pct" id="resultPct">100% Correct</p>
          <p class="result-message" id="resultMsg"></p>
          <div class="result-actions">
            <button class="btn btn-primary btn-lg" onclick="restartQuiz()">Try Again →</button>
            <a href="chat.html" class="btn btn-ghost btn-lg">Ask AI Tutor</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <footer class="footer" role="contentinfo">
    <div class="footer-inner">
      <a href="../../index.html" class="nav-brand" aria-label="Cyber Tutor AI home">
        <div class="brand-icon" aria-hidden="true">🛡</div>
        <span>CyberTutor <span class="brand-ai">AI</span></span>
      </a>
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="chat.html">Chat</a>
        <a href="quiz.html">Quiz</a>
        <a href="roadmap.html">Roadmap</a>
      </nav>
      <p class="footer-copy">© 2025 CyberTutor AI.</p>
    </div>
  </footer>

  <script src="../js/quiz.js"></script>
</body>
</html>
